# Copy to secret.yaml and fill locally, or populate from GitHub Secrets in CI.
# Never apply this empty template to the cluster.
apiVersion: v1
kind: Secret
metadata:
  name: assistant-api-secret
  namespace: tds-group-3
type: Opaque
stringData:
  # The ARN of the group's inference profile for EKS. Never in the repo.
  BEDROCK_MODEL_ID: ""
  # The Redis of the cluster, database /2 (users-api uses /0 and posts-api /1).
  REDIS_URL: ""
  # The public half of the key users-api signs its access tokens with.
  JWT_PUBLIC_KEY: ""
  OTEL_EXPORTER_OTLP_HEADERS: ""
