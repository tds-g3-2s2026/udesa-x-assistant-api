apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistant-api
  namespace: tds-group-3
spec:
  # One replica: the work is waiting on Bedrock, not CPU, and the cost is capped
  # by the rate limit, not by the number of pods. No HPA, so the count goes here.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: assistant-api
  template:
    metadata:
      labels:
        app: assistant-api
    spec:
      # ADR-023: the pod calls Bedrock as tds-group-3-bedrock-role, whose trust
      # policy only accepts this ServiceAccount. EKS reads its annotation and hands
      # the pod temporary credentials of the role: no access keys anywhere. The
      # docente applies it (udesa-x-platform, k8s/serviceaccount.yaml).
      serviceAccountName: tds-group-3-bedrock-sa
      containers:
        - name: assistant-api
          # CI must replace ECR_IMAGE with the assigned ECR URI and immutable tag/digest.
          image: "${ECR_IMAGE}"
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: assistant-api-config
            - secretRef:
                name: assistant-api-secret
          # /healthcheck checks nothing outside the process: Redis and Bedrock are
          # only reached by a request, so a failure there never restarts the pod.
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
