[project]
name = "assistant-api"
version = "1.1.0"
description = "Asistente por voz de UdeSA-X: elige acciones sobre el feed con un modelo de Bedrock"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    # crt: the credentials that `aws login` leaves behind need it to be read.
    "boto3[crt]>=1.41",
    "pydantic-settings>=2.7",
    # crypto: the access tokens of users-api are EdDSA.
    "pyjwt[crypto]>=2.10",
    "redis>=5.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.9",
    # Redis in memory: the rate limit is tested without a server.
    "fakeredis>=2.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant_api"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
# The root too, so the tests reach the evaluation harness under evals/.
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
